name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Cache de paquetes R
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-packages-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: r-packages-

      - name: Paquetes R (knitr/rmarkdown para renderizado Quarto)
        run: |
          install.packages(c("knitr", "rmarkdown"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Renderizar sitio
        uses: quarto-dev/quarto-actions/render@v2

      - name: Publicar en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          cname: epifitas.cl
